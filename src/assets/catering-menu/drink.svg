<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-label="Drinks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#1b2c54"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d38a"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <radialGradient id="citrus" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="1" stop-color="#e8b93f"/>
    </radialGradient>
  </defs>

  <rect width="900" height="600" fill="url(#bg)"/>

  <!-- faint citrus-slice ring motif, echoes the crest -->
  <circle cx="760" cy="90" r="140" fill="none" stroke="#f0d38a" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="120" cy="520" r="110" fill="none" stroke="#f0d38a" stroke-opacity="0.1" stroke-width="2"/>

  <!-- martini glass, left -->
  <g transform="translate(330,120)">
    <path d="M-70 0 L70 0 L6 96 L6 210 L-70 0 Z" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-60 8 L60 8 L4 94 Z" fill="#f0d38a" fill-opacity="0.18"/>
    <rect x="1" y="96" width="10" height="114" fill="url(#gold)"/>
    <rect x="-42" y="204" width="96" height="12" rx="6" fill="url(#gold)"/>
    <!-- citrus twist on the rim -->
    <g transform="translate(58,-4) rotate(18)">
      <circle r="24" fill="url(#citrus)" stroke="#c9a227" stroke-width="2"/>
      <g stroke="#c9a227" stroke-width="1.5" opacity="0.7">
        <line x1="0" y1="-18" x2="0" y2="18"/>
        <line x1="-15" y1="-9" x2="15" y2="9"/>
        <line x1="-15" y1="9" x2="15" y2="-9"/>
      </g>
    </g>
  </g>

  <!-- tall highball, right -->
  <g transform="translate(520,120)">
    <path d="M-38 0 L38 0 L28 260 C28 276 -28 276 -28 260 Z" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <path d="M-34 40 L34 40 L27 258 C27 270 -27 270 -27 258 Z" fill="#f0d38a" fill-opacity="0.16"/>
    <!-- bubbles -->
    <circle cx="-8" cy="120" r="4" fill="#f0d38a" fill-opacity="0.7"/>
    <circle cx="10" cy="160" r="3" fill="#f0d38a" fill-opacity="0.6"/>
    <circle cx="-14" cy="200" r="3.5" fill="#f0d38a" fill-opacity="0.55"/>
    <circle cx="6" cy="90" r="2.5" fill="#f0d38a" fill-opacity="0.6"/>
    <!-- mint sprig -->
    <g transform="translate(20,10) rotate(20)" fill="#7fae7a">
      <ellipse cx="0" cy="0" rx="9" ry="15"/>
      <ellipse cx="14" cy="10" rx="8" ry="13"/>
      <ellipse cx="-12" cy="12" rx="7" ry="12"/>
    </g>
    <!-- straw -->
    <rect x="-2" y="-40" width="7" height="90" rx="3" fill="url(#gold)" transform="rotate(-8)"/>
  </g>

  <!-- thin gold rule + label hint -->
  <rect x="0" y="592" width="900" height="8" fill="#c9a227" fill-opacity="0.35"/>
</svg>
